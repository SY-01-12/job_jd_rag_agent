<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Job JD RAG Agent</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="page">
    <aside class="sidebar">
      <div class="brand">
        <h1>Job JD RAG Agent</h1>
        <p>FastAPI + LangChain + RAG</p>
      </div>

      <div class="panel">
        <h2>示例问题</h2>
        <div class="quick-list">
          <button class="quick-btn" data-question="RAG 的核心流程是什么？">RAG 的核心流程是什么？</button>
          <button class="quick-btn" data-question="BM25 和 BGE 的区别是什么？">BM25 和 BGE 的区别是什么？</button>
          <button class="quick-btn" data-question="Chroma 的作用是什么？">Chroma 的作用是什么？</button>
          <button class="quick-btn" data-question="23 * 17 等于多少？">23 * 17 等于多少？</button>
          <button class="quick-btn" data-question="请读取 data/files/jd_agent_intern.txt 的内容">读取本地 JD 文件</button>
        </div>
      </div>

      <div class="panel">
        <h2>接口信息</h2>
        <ul class="meta-list">
          <li><strong>Method:</strong> POST</li>
          <li><strong>API:</strong> /agent/chat</li>
          <li><strong>Body:</strong> {"question": "..."}</li>
        </ul>
      </div>
    </aside>

    <main class="main">
      <header class="main-header">
        <div>
          <h2>智能问答</h2>
          <p>输入问题后，前端将请求 FastAPI 的 <code>/agent/chat</code> 接口。</p>
        </div>
      </header>

      <section class="chat-wrapper">
        <div id="messageList" class="message-list">
          <div class="message assistant">
            <div class="message-role">系统</div>
            <div class="message-content">
              你好，这里是 Job JD RAG Agent。请输入你的问题，例如技术知识问答、文件读取、关键词提取或岗位能力差距分析。
            </div>
          </div>
        </div>

        <form id="chatForm" class="chat-form">
          <textarea id="questionInput" placeholder="请输入问题，例如：Chroma 的作用是什么？" rows="4"></textarea>
          <div class="form-actions">
            <button type="button" id="clearBtn" class="btn btn-secondary">清空对话</button>
            <button type="submit" id="sendBtn" class="btn btn-primary">发送</button>
          </div>
        </form>
      </section>
    </main>
  </div>

  <template id="messageTemplate">
    <div class="message">
      <div class="message-role"></div>
      <div class="message-content"></div>
    </div>
  </template>

  <script src="/static/app.js"></script>
</body>
</html>
